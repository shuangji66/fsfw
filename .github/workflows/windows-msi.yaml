name: windows-msi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 x.y.z（例如 1.0.0）"
        required: true
        type: string
      release_notes:
        description: "更新日志内容（支持 Markdown）"
        required: true
        type: string

run-name: Build FSFW ${{ inputs.version }} and Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Set version
        shell: pwsh
        env:
          FSFW_INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$env:FSFW_INPUT_VERSION"

      - name: Build MSI
        run: npm run build

      - name: Upload MSI to Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsfw-msi-${{ inputs.version }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          make_latest: true
